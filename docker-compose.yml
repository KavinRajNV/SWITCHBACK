# Fully offline MongoDB for Switchback — no Atlas, no API keys.
#
#   docker compose up -d          # starts mongo + restores the bundled snapshot
#   docker compose down           # stop (data persists in the named volume)
#   docker compose down -v        # stop and wipe the volume (next up re-restores)
#
# Then run the app with MONGODB_URI unset (or =mongodb://localhost:27017):
#   ./scripts/dev.sh   /   pwsh scripts/dev.ps1

services:
  mongo:
    image: mongo:7
    container_name: switchback-mongo
    ports:
      - "27017:27017"
    volumes:
      - switchback_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: load data/mongo_snapshot/ into the mongo service, then exit.
  mongo-seed:
    image: mongo:7
    container_name: switchback-mongo-seed
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data/mongo_snapshot:/snapshot:ro
    entrypoint: >
      bash -c "
        echo 'Restoring switchback snapshot...' &&
        mongorestore --uri mongodb://mongo:27017 --drop --noIndexRestore /snapshot &&
        echo 'Snapshot restored.'
      "
    restart: "no"

volumes:
  switchback_mongo_data:
